baseURL = 'https://paragliding.app/'
languageCode = 'en-us'
title = 'Paragliding App'
theme = 'pehtheme-hugo'

summaryLength = 30
googleAnalytics = ''
disqusShortname = ''

[params]
	description = 'Curated directory of the best paragliding apps, maps, instruments, weather tools, and tutorials for free-flight pilots.'
	keywords = 'paragliding, hang gliding, free flight, paragliding apps, flight instruments, weather, launch sites, cross country, tutorials'
	mainSections = 'applications'

[author]
	name = 'Paragliding App'
	bio = 'Resources for paraglider and hang glider pilots worldwide.'
	avatar = ''
	twitter = ''

[pagination]
	pagerSize = 9

[menu]
	[[menu.main]]
		name = 'Home'
		pageRef = '/'
		weight = 10
	[[menu.main]]
		name = 'Applications'
		pageRef = '/applications/'
		weight = 15
	[[menu.main]]
		name = 'Tutorials'
		pageRef = '/tutorials/'
		weight = 20
	[[menu.main]]
		name = 'Contact us'
		pageRef = '/contact/'
		weight = 25

[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"
  [module.mounts]
  	source = 'assets'
  	target = 'static'