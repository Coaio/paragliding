<article class="relative group flex flex-row">
	<a class="insert-link" href="{{ .Permalink }}"></a>
	<figure class="relative basis-1/3 aspect-square overflow-hidden rounded-2xl bg-white">

		{{- if .Params.image }}

		  {{- if (strings.HasPrefix .Params.image "http") }}

		  <img class="group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ .Params.image }}" alt="{{ $.Name }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;">

		  {{- else }}

			{{- with $imglist := resources.Get .Params.image -}}
			  {{- $imglist := $imglist.Fit "250x250 q85" -}}
			  <img class="group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $imglist.Permalink }}" alt="{{ $.Name }}" width="{{ $imglist.Width }}" height="{{ $imglist.Height }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;">
			{{- end }}

		  {{- end }}

		{{- end }}

	</figure>
	<div class="basis-2/3 self-center ml-4">
		<h3 class="font-bold group-hover:underline decoration-auto">{{ .LinkTitle }}</h3>
	</div>
</article>
